<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="asGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="asGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Large, Borderless, Highly Visible <AS/> Monogram -->
  <text
    x="32"
    y="43"
    text-anchor="middle"
    fill="url(#asGrad)"
    filter="url(#asGlow)"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Mono', 'Geist Mono', Menlo, Consolas, monospace"
    font-weight="900"
    font-size="24"
    letter-spacing="-1px"
  >&lt;AS/&gt;</text>
</svg>
