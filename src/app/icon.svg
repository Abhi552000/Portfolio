<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Inner Subtle Glow Rim -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Code Monogram <AKS/> -->
  <text
    x="32"
    y="38.5"
    text-anchor="middle"
    fill="url(#textGrad)"
    filter="url(#glow)"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Mono', 'Geist Mono', Menlo, Consolas, monospace"
    font-weight="900"
    font-size="16.5"
    letter-spacing="-0.5px"
  >&lt;AKS/&gt;</text>
</svg>
