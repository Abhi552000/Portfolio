<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Border Gradient: Cyan to Purple -->
    <linearGradient id="brandBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtle Ambient Glow inside dark squircle -->
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Squircle App Container (Crisp visibility on Light & Dark browser tabs) -->
  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="14"
    fill="#050814"
    stroke="url(#brandBorder)"
    stroke-width="2.5"
  />

  <!-- Internal Ambient Glow -->
  <rect
    x="4"
    y="4"
    width="56"
    height="56"
    rx="13"
    fill="url(#ambientGlow)"
  />

  <!-- Geometric Code Glyphs: Cyan < -->
  <path
    d="M 18 24 L 11 32 L 18 40"
    stroke="#38bdf8"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- High-Contrast Monogram: AS (Crisp White) -->
  <text
    x="31"
    y="38.5"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="17"
    letter-spacing="-0.5px"
    fill="#ffffff"
  >AS</text>

  <!-- Geometric Code Glyphs: Purple / and > -->
  <line
    x1="45"
    y1="24"
    x2="41"
    y2="40"
    stroke="#c084fc"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <path
    d="M 46 24 L 53 32 L 46 40"
    stroke="#c084fc"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
